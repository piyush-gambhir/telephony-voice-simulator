[project]
name = "telephony-voice-simulator"
version = "0.1.0"
description = "Telephony and voice scenario simulator for AMD, IVR, PBX, routing, and call grading."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "livekit>=1.0.0",
    "livekit-api>=1.0.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "soundfile>=0.12",
    "httpx>=0.27",
    "pymysql>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
telephony-voice-sim = "telephony_voice_simulator.control.cli:main"
amd-sim = "telephony_voice_simulator.control.cli:main"
telephony-sim = "telephony_voice_simulator.control.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["telephony_voice_simulator*"]

[tool.setuptools.package-data]
telephony_voice_simulator = [
    "scenarios/*.yaml",
    "corpus/assets_manifest.json",
    "corpus/public_release_allowlist.json",
    "pstn/twilio_hosted/*.js",
    "templates/*.json",
]

[tool.setuptools.exclude-package-data]
telephony_voice_simulator = [
    "corpus/assets/*.mp3",
    "corpus/assets/*.wav",
    "corpus/assets/compiled/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
