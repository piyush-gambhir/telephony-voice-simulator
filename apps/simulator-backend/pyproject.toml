[project]
name = "telephony-voice-simulator"
version = "0.2.0"
description = "Telephony and voice scenario simulator for AMD, IVR, PBX, routing, and call grading."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "livekit>=1.1.21",
    "livekit-api>=1.2.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "aiohttp>=3.14.5",
    "soundfile>=0.14.0",
    "httpx>=0.28.1",
    "pymysql>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.1", "ruff>=0.17.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
telephony-voice-sim = "telephony_voice_simulator.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["telephony_voice_simulator*"]

[tool.setuptools.package-data]
telephony_voice_simulator = [
    "scenarios/*.yaml",
    "corpus/assets_manifest.json",
    "corpus/public_release_allowlist.json",
    "telephony/twilio/hosted/*.js",
    "templates/*.json",
]

[tool.setuptools.exclude-package-data]
telephony_voice_simulator = [
    "scenarios/*.local.*",
    "corpus/assets/*.mp3",
    "corpus/assets/*.wav",
    "corpus/assets/compiled/*",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Ruff 0.16 dropped these from its default set; keep enforcing them as before.
extend-select = [
    "E401", "E402", "E701", "E702", "E703", "E711", "E712", "E713", "E714",
    "E721", "E731", "E741", "E742", "E743", "F403", "F405", "F722",
]
# Newly default in ruff 0.16/0.17 and flagged by existing code; not adopted yet.
extend-ignore = [
    "BLE001", "EXE001", "I001", "ISC004", "PIE810", "PLW1510", "PYI034",
    "RUF015", "SIM102", "SIM117", "TRY004", "UP035", "UP041",
]

[tool.ruff.lint.per-file-ignores]
# B023 false positives: each closure is called and finishes inside the same
# loop iteration, so it never sees a later value of the loop variable.
"src/telephony_voice_simulator/telephony/twilio/compile.py" = ["B023"]
"tests/test_mysql_integration.py" = ["B023"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
