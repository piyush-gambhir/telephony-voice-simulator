# Portable example: the command adapter invokes the repository's generic
# LiveKit outbound adapter and lets that command perform hosted PSTN grading.
# Copy this file, choose your own matrix, and provide credentials through the
# environment variables documented in docs/CONFIGURATION.md.
version: 1
continue_on_failure: true
delay_seconds: 5

matrix:
  - scenario: stock_voicemail_beep_1000
  - scenario: pbx_segmented_voicemail_cleanroom
  - scenario: dtmf_gate_honored

steps:
  - name: run_hosted_call
    adapter:
      type: command
      cwd: ..
      timeout_seconds: 420
      argv:
        - uv
        - run
        - python
        - -m
        - telephony_voice_simulator.agent_call
        - --scenario
        - "{scenario}"

