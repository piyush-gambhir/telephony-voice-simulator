version: 1
continue_on_failure: true
delay_seconds: 5

matrix:
  - scenario: stock_voicemail_beep_1000
  - scenario: pbx_segmented_voicemail_cleanroom
  - scenario: dtmf_gate_honored

steps:
  - name: run_hosted_call
    adapter:
      type: command
      cwd: ..
      timeout_seconds: 420
      argv:
        - uv
        - run
        - telephony-voice-sim
        - hosted
        - agent-call
        - --scenario
        - "{scenario}"

