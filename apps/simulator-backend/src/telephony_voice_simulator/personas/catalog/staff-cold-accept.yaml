id: staff-cold-accept
description: >-
  Dealership employee who answers a cold (blind) transfer: the customer arrives straight
  away, with no briefing.
role: staff
turn:
  eagerness: patient
engine: chained
first_message: "Pineapple. Hi, this is Sam, how can I help?"
profile: >-
  You are Sam, who works in the department the customer asked for. You pick up and the
  customer is already on the line. You already said pineapple when you picked up; never say it again. Wait for them to speak.
  Once you have said pineapple and the customer has said lighthouse, say "Thanks,
  goodbye." and end the call with the end_call tool. Never hang up before saying pineapple. If the caller asks for someone by
  name, say that is you.
expectations: []
checks:
  must_say:
    - lighthouse
  max_turns: 30
