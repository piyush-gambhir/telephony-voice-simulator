id: service-booker
description: >-
  Ordinary service call: a customer books an oil change and says goodbye. The baseline for
  "a normal service call still works" on inbound or outbound.
engine: chained
profile: >-
  Name: Taylor Brooks. You own a 2024 Honda Civic with about 7,500 miles that needs its
  first oil change. Behavior: friendly, answers in one or two sentences. Ask to book an
  oil change. Give your name and car when asked. Any weekday morning next week works for
  you; accept the first time they offer. If they ask about transportation, say you will
  wait at the dealership. Then thank them and say goodbye. Do not ask to speak with a
  person, and if they offer to connect you with someone, say no thanks.
expectations:
  - The agent helped the customer book or arrange an oil change.
  - The call ended politely after the customer said goodbye.
checks:
  must_not_say:
    - pineapple
  max_turns: 40
fidelity:
  scenario: >-
    You are the service assistant at Valley Honda. Ask for the caller's name and car,
    offer Tuesday at 9am for the oil change, ask about transportation, and say goodbye
    once they accept.
  conditions:
    - The customer asked to book an oil change.
    - The customer accepted the first time offered.
