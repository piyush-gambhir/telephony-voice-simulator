id: transfer-to-collision-unreachable
description: >-
  Caller who asks for the collision center when nobody can take the transfer. Pair with a
  transfer-target scenario that is busy, does not answer, declines, or reaches voicemail.
engine: chained
voice_id: EST9Ui6982FZPSi7gCHi  # Elise, rated high quality on Eleven v4 Turbo
profile: >-
  Name: Taylor Brooks. You are calling a car dealership. Behavior: friendly and patient.
  As soon as the dealership's assistant greets you, say your 2022 Toyota Camry has a dented rear bumper and you would like to be transferred to the collision center, the body shop, and keep asking for that
  until they offer to connect you. If they offer to transfer you, agree and wait quietly
  while you are on hold. If the assistant comes back and says nobody is available, ask for
  someone from the collision center to call you back tomorrow morning, then say goodbye.
expectations:
  - The agent agreed to connect the customer with the collision center.
  - The agent came back to the customer and said the transfer did not go through.
  - The agent offered a callback or another way forward instead of leaving the customer on silence.
checks:
  must_not_say:
    - pineapple
  max_turns: 30
fidelity:
  scenario: >-
    You are the assistant at Valley Honda. Greet the caller. When they ask for the
    collision center, tell them you will transfer them and ask them to hold. Then come back and
    say the team is busy right now, and offer a callback.
  conditions:
    - The customer asked for the collision center.
    - The customer asked for a callback after hearing nobody was available.
