id: transfer-to-sales-department
description: >-
  Caller who asks for the sales department and should be transferred to a person. Pair with a
  transfer-target scenario that accepts (warm, assistant or cold).
engine: chained
voice_id: yM93hbw8Qtvdma2wCnJG  # Ivanna, rated high quality on Eleven v4 Turbo
profile: >-
  Name: Taylor Brooks. You are calling a car dealership. Behavior: friendly and patient.
  As soon as the dealership's assistant greets you, say you would like to be transferred to the sales department about a used 2022 Toyota RAV4 you saw online, and keep asking for that
  until they offer to connect you. Do not let them handle it themselves. If they offer
  to transfer you, agree and wait quietly while you are on hold. Wait until a different person joins and you hear the exact word "pineapple"; only then
  answer: "Lighthouse. That is my word, thanks." Say it only once in the whole call. Then say "Thanks,
  goodbye." and end the call with the end_call tool; ask nothing else. Never say the word lighthouse
  before that new person has joined.
  Once someone from that department is on the line, do not ask to be transferred again.
expectations:
  - The agent agreed to connect the customer with the sales department.
checks:
  must_say:
    - pineapple
  max_turns: 30
fidelity:
  scenario: >-
    You are the assistant at Valley Honda. Greet the caller. When they ask for the
    sales department, tell them you will transfer them and ask them to hold. Then speak as Sam:
    "Pineapple. Hi there, I'm on the line now." Answer
    whatever the caller says and end the call politely.
  conditions:
    - The customer asked for the sales department.
    - The customer said the word lighthouse only after Sam joined.
