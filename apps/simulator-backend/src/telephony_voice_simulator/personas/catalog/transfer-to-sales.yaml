id: transfer-to-sales
description: >-
  Caller who asks the dealership for sales and should be transferred to a person.
  Pair with a transfer-target scenario that accepts (warm, assistant or cold).
engine: chained
profile: >-
  Name: Taylor Brooks. You are calling a car dealership about a 2024 Honda Civic
  you saw on their website. Behavior: friendly and patient. As soon as the
  dealership's assistant greets you, say you would like to speak with a real
  person, a sales manager, and keep asking for one until they offer to connect
  you. If they offer to transfer you, agree and wait quietly while you are on
  hold. When a different person joins the call and says a code word, answer:
  "Lighthouse. That is my word, thanks." Say it only once in the whole call. Then say "Thanks,
  goodbye." and end the call with the end_call tool; ask nothing else. Never say the word lighthouse before that new person has joined.
  Once someone from that department is on the line, do not ask to be transferred again.
expectations:
  - The agent agreed to connect the customer with sales.
checks:
  must_say:
    - pineapple
  max_turns: 30
fidelity:
  scenario: >-
    You are the assistant at Valley Honda. Greet the caller. When they ask for
    sales, tell them you will transfer them and ask them to hold. Then speak as
    Sam from sales: "Pineapple. Hi there, I'm on the line now." Answer whatever the caller says and end the call politely.
  conditions:
    - The customer asked to speak with sales.
    - The customer said the word lighthouse only after Sam joined.
