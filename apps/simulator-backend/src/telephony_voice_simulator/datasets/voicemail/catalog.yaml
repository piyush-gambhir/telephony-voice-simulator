version: 1
categories:
  - id: carrier_default
    label: "Carrier default greeting"
    description: "Network-provided greeting with no recorded name. Phrase-based detection should fire, and the message must wait for the beep."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: carrier_number_readback
    label: "Carrier number readback"
    description: "Network greeting that reads the dialed number back digit by digit. The number can read like a person confirming a number, so the greeting is long before any cue."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: personal_short
    label: "Short personal greeting"
    description: "Brief recorded greeting in a person's own voice. Casual tone and very little text make it easy to mistake for a live answer."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: personal_custom_no_stock_phrase
    label: "Custom greeting without stock phrases"
    description: "Personal greeting that never says leave a message or similar. Phrase lists miss it, so detection must lean on the beep or audio cues."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: personal_long_rambling
    label: "Long rambling greeting"
    description: "Fifteen to twenty-five seconds of personal chatter before the beep. Agents that give up waiting or start talking early fail here."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: personal_starts_like_human
    label: "Greeting that opens like a person"
    description: "Recording opens with hello or hi and a pause, as if someone picked up, then turns into a greeting. The classic trap for early human classification."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: multipart_name_spliced
    label: "Carrier frame with recorded name"
    description: "Carrier phrasing wrapped around a separately recorded name, so voice and cadence change mid greeting."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: business_after_hours
    label: "Business after-hours greeting"
    description: "Business recording that states hours and then offers a mailbox. Long, formal, and full of human-sounding scripted speech."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: business_department_mailbox
    label: "Business department mailbox"
    description: "Department or shared mailbox greeting that names a team rather than a person."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: live_voicemail_transcribing
    label: "Live voicemail with transcription"
    description: "Phone OS live voicemail that tells the caller the message is being transcribed. The mailbox is real, but a person may listen in and speak."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: noisy_or_music_greeting
    label: "Greeting with music or noise"
    description: "Greeting over a bed of background sound. Noise defeats silence-based and energy-based cues."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: spanish_voicemail
    label: "Spanish voicemail"
    description: "Spanish-language greeting. English-only phrase lists miss it."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: bilingual_greeting
    label: "Bilingual greeting"
    description: "Greeting that repeats itself in two languages, doubling the time before the beep."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: unusual_beep
    label: "Unusual beep shape"
    description: "Late, doubled, low-pitched or high-pitched record tone. Detectors tuned to a single one second tone near 1000 Hz miss these."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: tone_only
    label: "Tone only"
    description: "A record tone with no greeting at all. Only beep detection can classify the call."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: no_beep_after_greeting
    label: "Greeting without a beep"
    description: "Mailbox that goes straight to recording when the greeting ends. The agent must speak after the greeting finishes, not wait for a tone."
    expected_class: machine-vm
    expected_outcome: leave_message_no_beep
  - id: call_screener_ai
    label: "AI call screener"
    description: "Assistant that asks the caller for a name and reason, then rings the person. The agent must answer the screener and stay on the line."
    expected_class: screener
    expected_outcome: stay_through_screen
  - id: screener_record_name
    label: "Record-your-name screener"
    description: "Prompt that asks for a name after a tone and connects the call to a person afterwards. The tone is not a voicemail beep."
    expected_class: screener
    expected_outcome: stay_through_screen
  - id: dtmf_gate_press_key
    label: "Press a key to continue"
    description: "Prompt that blocks the call until a specific key is pressed, then connects a person."
    expected_class: screener
    expected_outcome: press_key_then_continue
  - id: mailbox_full
    label: "Mailbox full"
    description: "Recording says the mailbox cannot take messages. The agent should end the call without leaving one."
    expected_class: machine-unavailable
    expected_outcome: hang_up_inbox_full
  - id: mailbox_not_set_up
    label: "Mailbox not set up"
    description: "Recording says the mailbox has not been set up. No message can be left."
    expected_class: machine-unavailable
    expected_outcome: hang_up_unreachable
  - id: number_disconnected_or_unreachable
    label: "Disconnected or unreachable"
    description: "Special information tones or an announcement that the number cannot be reached. The agent should hang up."
    expected_class: machine-unavailable
    expected_outcome: hang_up_unreachable
  - id: business_ivr_menu
    label: "Business phone menu"
    description: "Automated menu that lists options and waits for keys. No person or mailbox is reachable without navigation."
    expected_class: machine-ivr
    expected_outcome: hang_up_ivr
  - id: human_short_hello
    label: "Human: short hello"
    description: "A person who answers with a bare hello. Short, with no machine cues, and must not be treated as voicemail."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_name_answer
    label: "Human: answers with a name"
    description: "A person who answers with their name. Reads like a greeting but a person is on the line."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_busy_driving
    label: "Human: busy or driving"
    description: "A distracted person with noise and hurry in their speech."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_screening_by_asking
    label: "Human: screens by asking who is calling"
    description: "A person who asks who is calling before saying anything else."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_kid_or_family_answers
    label: "Human: child or family member answers"
    description: "A child or relative answers, speaks briefly, and may call for someone else."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_business_receptionist
    label: "Human: business receptionist"
    description: "A receptionist with a scripted business greeting. Scripted speech sounds like a recording."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_short_confirmation
    label: "Human: one-word confirmation"
    description: "A person answers the agent's name question with one or two words. In production audits this was the live answer most often scored as voicemail."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_callback_brushoff
    label: "Human: busy, call back later"
    description: "A person says they are busy and will call back, using words that also appear in recorded greetings."
    expected_class: human
    expected_outcome: talk_to_human
  - id: human_with_background_audio
    label: "Human: background audio"
    description: "A person answers while a car navigation voice, radio, or TV plays. The other voice is not a recording of the callee."
    expected_class: human
    expected_outcome: talk_to_human
  - id: hold_or_connecting_then_human
    label: "Hold or connecting message, then a person"
    description: "A forwarding or hold recording plays before a person picks up. It is a recording, but not a mailbox: leaving a message here talks over the person."
    expected_class: human
    expected_outcome: talk_to_human
  - id: business_recording_then_human
    label: "Business intro recording, then a person"
    description: "A welcome line or call-recording notice plays, then a staff member answers."
    expected_class: human
    expected_outcome: talk_to_human
  - id: ai_screener_recording_notice
    label: "AI call assistant that records the call"
    description: "A phone's AI assistant says it is recording the call for the owner and asks who is calling, often in Spanish too. The owner may pick up afterwards."
    expected_class: screener
    expected_outcome: stay_through_screen
  - id: greeting_alternative_contact
    label: "Greeting that asks for a text instead"
    description: "Personal greeting that points to a text or another channel and never uses a stock voicemail phrase."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: greeting_screens_sales
    label: "Greeting that warns sales callers off"
    description: "Personal greeting that tells sales or list callers not to leave a message, then promises a call back to everyone else."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: greeting_clipped_start
    label: "Greeting heard only from the middle"
    description: "The first words are lost while the agent's opener plays, so only the tail of the greeting reaches the detector."
    expected_class: machine-vm
    expected_outcome: leave_message_after_beep
  - id: carrier_not_set_up_fast_hangup
    label: "Not-set-up mailbox that drops the line fast"
    description: "Carrier says the mailbox is not set up and ends the call within a second, often before a classifier decides. It must still be reported as an unavailable mailbox, not as the callee hanging up."
    expected_class: machine-unavailable
    expected_outcome: hang_up_unreachable
entries:
  - id: carrier_default_01
    category: carrier_default
    prevalence: common
    difficulty: easy
    language: en
    segments:
      - {say: {text: "The person you are calling is not available. At the tone, please record your message.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: carrier_default_02
    category: carrier_default
    prevalence: common
    difficulty: easy
    language: en
    segments:
      - {say: {text: "Your call has been forwarded to an automated voice message system. The person you are trying to reach is not available. Please leave your message after the tone.", voice: "male"}}
      - {pause: 0.8}
      - {tone: {freq: 1000, duration: 0.6}}
      - {hold: 45}
      - {hangup: true}
  - id: carrier_default_03
    category: carrier_default
    prevalence: occasional
    difficulty: medium
    language: en
    why_hard: "Closing instructions about hanging up or pressing a key add several seconds before the beep and invite a key press."
    segments:
      - {say: {text: "Sorry, nobody is available to take your call. When you are finished recording, you may hang up, or press one for more options.", voice: "female"}}
      - {pause: 1.4}
      - {tone: {freq: 1400, duration: 0.4}}
      - {hold: 45}
      - {hangup: true}
  - id: carrier_number_readback_01
    category: carrier_number_readback
    prevalence: common
    difficulty: easy
    language: en
    segments:
      - {say: {text: "The number you have dialed, 555-0142, is not available. At the tone, please record your message.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: carrier_number_readback_02
    category: carrier_number_readback
    prevalence: common
    difficulty: medium
    language: en
    why_hard: "The spoken digits come first, so the opening sounds like a person reading a number."
    segments:
      - {say: {text: "Please leave a message for five five five, zero one two three. When you are done, hang up.", voice: "male"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: carrier_number_readback_03
    category: carrier_number_readback
    prevalence: occasional
    difficulty: medium
    language: en
    why_hard: "A short pause and a long beep follow a greeting that is almost entirely digits."
    segments:
      - {say: {text: "The subscriber at 555-0188 cannot take your call right now. Please leave a message after the beep.", voice: "neutral"}}
      - {pause: 0.6}
      - {tone: {freq: 1000, duration: 0.7}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_short_01
    category: personal_short
    prevalence: common
    difficulty: easy
    language: en
    segments:
      - {say: {text: "Hey, it's Sam. Leave a message and I'll call you back.", voice: "male"}}
      - {pause: 0.8}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_short_02
    category: personal_short
    prevalence: common
    difficulty: medium
    language: en
    why_hard: "Casual, friendly delivery sounds like a person answering in real time."
    segments:
      - {say: {text: "Hi, you've reached Maya. I can't get to the phone. Leave me a message.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.4}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_short_03
    category: personal_short
    prevalence: occasional
    difficulty: medium
    language: en
    why_hard: "Two words and no stock phrase; there is almost nothing to classify before the beep."
    segments:
      - {say: {text: "Yo. Leave it.", voice: "male"}}
      - {pause: 0.5}
      - {tone: {freq: 1000, duration: 0.4}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_custom_no_stock_phrase_01
    category: personal_custom_no_stock_phrase
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "No leave-a-message wording anywhere in the greeting; only the beep gives it away."
    segments:
      - {say: {text: "Out fishing, talk soon.", voice: "male"}}
      - {pause: 1.2}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_custom_no_stock_phrase_02
    category: personal_custom_no_stock_phrase
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "The greeting reads like a statement from a person, with no mailbox language."
    segments:
      - {say: {text: "This is Jordan. Gone to the lake until Sunday. Take care.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_custom_no_stock_phrase_03
    category: personal_custom_no_stock_phrase
    prevalence: rare
    difficulty: hard
    language: en
    why_hard: "Playful wording and a pause before a lower beep."
    segments:
      - {say: {text: "Ha ha, you just missed me. Maybe next time.", voice: "male"}}
      - {pause: 1.5}
      - {tone: {freq: 900, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_long_rambling_01
    category: personal_long_rambling
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "About twenty seconds of speech with filler words and conversational asides before any beep."
    segments:
      - {say: {text: "Hey there, this is Pat. So, uh, I'm probably out in the garden, or maybe at the store picking up something for dinner, or I could be on the other line. Anyway, I'll get back to you as soon as I can. I check these a couple of times a day, so don't worry. Okay, here goes.", voice: "female"}}
      - {pause: 1.2}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_long_rambling_02
    category: personal_long_rambling
    prevalence: rare
    difficulty: hard
    language: en
    why_hard: "Over twenty seconds of household chatter; agents with an early timeout talk over the greeting."
    segments:
      - {say: {text: "Hello, you've reached the Hamilton house. We're not here right now. We might be at soccer practice, or at the grocery store, or just ignoring the phone. If it's urgent, try the other number on the fridge. Otherwise, tell us your name, your number, and what you need, and we'll call back when we can. Thanks for calling, and have a great day.", voice: "male"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_starts_like_human_01
    category: personal_starts_like_human
    prevalence: common
    difficulty: hard
    language: en
    why_hard: "Opens with a live-sounding hello and a pause, so early classification calls it a person."
    segments:
      - {say: {text: "Hello?", voice: "female"}}
      - {pause: 1.3}
      - {say: {text: "Ha, got you. You've reached Riley. Leave a message and I'll get back to you.", voice: "female"}}
      - {pause: 0.9}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_starts_like_human_02
    category: personal_starts_like_human
    prevalence: common
    difficulty: hard
    language: en
    why_hard: "A cheerful hi and a long pause mimic a person waiting for the caller."
    segments:
      - {say: {text: "Hi!", voice: "male"}}
      - {pause: 1.6}
      - {say: {text: "Sorry, can't come to the phone right now. Leave your name and number.", voice: "male"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: personal_starts_like_human_03
    category: personal_starts_like_human
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "Two hellos and two seconds of silence, the strongest human-sounding opening in the set."
    segments:
      - {say: {text: "Hello? Hello?", voice: "female"}}
      - {pause: 2.0}
      - {say: {text: "Just kidding. This is Casey's voicemail. Say something after the beep.", voice: "female"}}
      - {pause: 0.8}
      - {tone: {freq: 1000, duration: 0.6}}
      - {hold: 45}
      - {hangup: true}
  - id: multipart_name_spliced_01
    category: multipart_name_spliced
    prevalence: common
    difficulty: medium
    language: en
    why_hard: "The recorded name changes voice and cadence in the middle of the greeting."
    segments:
      - {say: {text: "You have reached the voice mailbox of", voice: "female"}}
      - {say: {text: "Taylor Brooks", voice: "male"}}
      - {say: {text: "is not available. Please leave a message after the tone.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: multipart_name_spliced_02
    category: multipart_name_spliced
    prevalence: common
    difficulty: medium
    language: en
    why_hard: "Short spliced pieces with pauses between them can look like several speakers."
    segments:
      - {say: {text: "Hi, you've reached", voice: "female"}}
      - {say: {text: "Morgan and Lee", voice: "male"}}
      - {say: {text: "Please record your message at the tone.", voice: "female"}}
      - {pause: 1.2}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: business_after_hours_01
    category: business_after_hours
    prevalence: common
    difficulty: medium
    language: en
    why_hard: "Long formal greeting that includes hours and an emergency number."
    segments:
      - {say: {text: "Thank you for calling Riverside Dental. Our office is currently closed. Our hours are Monday through Friday, eight to five. If this is an emergency, please call 555-0150. Otherwise, leave your name and number after the tone.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: business_after_hours_02
    category: business_after_hours
    prevalence: common
    difficulty: medium
    language: en
    why_hard: "Business scripts sound close to a live receptionist."
    segments:
      - {say: {text: "You've reached Maple Street Auto Repair. We're closed for the day. Please leave a message and the service desk will return your call when we open tomorrow.", voice: "male"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.6}}
      - {hold: 45}
      - {hangup: true}
  - id: business_department_mailbox_01
    category: business_department_mailbox
    prevalence: common
    difficulty: easy
    language: en
    segments:
      - {say: {text: "You have reached the billing department mailbox for Northwind Clinic. Leave your account name and a number where we can reach you.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: business_department_mailbox_02
    category: business_department_mailbox
    prevalence: occasional
    difficulty: medium
    language: en
    why_hard: "Terse, desk-style delivery with no mailbox wording until the last clause."
    segments:
      - {say: {text: "Service department. No one is at the desk right now. After the beep, tell us your name, the vehicle, and how we can help.", voice: "male"}}
      - {pause: 0.7}
      - {tone: {freq: 1000, duration: 0.4}}
      - {hold: 45}
      - {hangup: true}
  - id: live_voicemail_transcribing_01
    category: live_voicemail_transcribing
    prevalence: common
    difficulty: hard
    language: en
    why_hard: "The notice that speech is being transcribed invites a short reply from a person listening in."
    segments:
      - {say: {text: "Please leave a message. Your message will be transcribed as you speak.", voice: "female"}}
      - {pause: 0.9}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: live_voicemail_transcribing_02
    category: live_voicemail_transcribing
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "Describes live text delivery, so the line may be answered by the callee while the agent speaks."
    segments:
      - {say: {text: "The person you are calling cannot answer. Speak after the tone, and a text version of your message will be sent to them as you talk.", voice: "neutral"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: noisy_or_music_greeting_01
    category: noisy_or_music_greeting
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "A long quiet hum stands in for background music before the speech starts."
    segments:
      - {tone: {freq: 330, duration: 4.0, amplitude: 2500}}
      - {say: {text: "Hey, thanks for calling. Leave a message and we'll call you back.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: noisy_or_music_greeting_02
    category: noisy_or_music_greeting
    prevalence: rare
    difficulty: hard
    language: en
    why_hard: "Noise bed continues through the pause where a beep detector expects silence."
    segments:
      - {say: {text: "Hi, you've reached the party line. Leave a message, I can barely hear myself think.", voice: "male"}}
      - {tone: {freq: 220, duration: 3.0, amplitude: 2500}}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: spanish_voicemail_01
    category: spanish_voicemail
    prevalence: occasional
    difficulty: medium
    language: es
    why_hard: "English-only phrase lists miss the greeting."
    segments:
      - {say: {text: "Hola, en este momento no puedo contestar. Por favor deje su mensaje después del tono.", voice: "female"}}
      - {pause: 1.0}
      - {tone: {freq: 1000, duration: 0.5}}
      - {hold: 45}
      - {hangup: true}
  - id: spanish_voicemail_02
    category: spanish_voicemail
    prevalence: occasional
    difficulty: medium
    language: es-US
    why_hard: "A named personal greeting in Spanish with no stock phrase in English."
    segments:
      - {say: {text: "Ha llegado al buzón de voz de Carlos. No estoy disponible. Deje su nombre y su número, y le devolveré la llamada.", voice: "male"}}
      - {pause: 1.2}
      - {tone: {freq: 1000, duration: 0.6}}
      - {hold: 45}
      - {hangup: true}
  - id: bilingual_greeting_01
    category: bilingual_greeting
    prevalence: occasional
    difficulty: hard
    language: en
    why_hard: "The beep arrives only after the second language, so a detector that decides after the first sentence is wrong."
    segments:
