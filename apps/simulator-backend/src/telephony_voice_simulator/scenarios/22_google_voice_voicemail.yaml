# Google Voice / Google Fi voicemail interaction shape, modeled with
# simulator-authored prompt copy and a standard tone-adjacent tail. The agent
# must detect it and leave the configured message after the beep.
name: google_voice_voicemail
machine:
  main:
    - wait: 0.8
    - play: google_voice_voicemail.wav
    - wait: 0.8
    - tone: {freq: 1000, duration: 0.6, amplitude: 12000}
    - hold: 45            # mailbox record window
    - hangup: true        # mailbox max-record timeout: it ends the call itself
config_overrides:
  voicemail_detection: {beep_detection: true}
expect:
  webhook_received: true
  ended_reason: call.ending.voicemail-left-message
  detection_layer_prefix_any_of: [livekit-amd, phrase-fallback]
  message_start_after: {mark: tone_end, min: 0.1, max: 3.0}
  message_content:
    expected: "Hi, this is Emily from Apex Motors calling about your recent service enquiry. Please give us a call back whenever convenient. Thank you, and have a great day!"
    min_recall: 0.75
