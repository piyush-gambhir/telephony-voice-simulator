# Clean-room enterprise PBX voicemail fixture. The three independently
# generated prompt fragments and synthesized record tone reproduce the timing
# and concatenation behavior of a segmented PBX without using vendor audio,
# vendor transcripts, or a cloned voice.
name: pbx_segmented_voicemail_cleanroom
machine:
  main:
    - wait: 0.8
    - play: pbx_extension_announcement.wav
    - wait: 0.1
    - play: pbx_party_unavailable.wav
    - wait: 0.2
    - play: pbx_leave_message.wav
    - wait: 0.4
    - tone: {freq: 1000, duration: 0.5, amplitude: 12000}
    - hold: 45
    - hangup: true
config_overrides:
  voicemail_detection: {beep_detection: true, semantic_detection: true}
expect:
  webhook_received: true
  ended_reason: call.ending.voicemail-left-message
  detection_layer_prefix_any_of: [livekit-amd, phrase-fallback]
  message_start_after: {mark: tone_end, min: 0.1, max: 3.0}
  max_overlap_between_marks: {start: tone_start, end: tone_end, max_s: 0.05}
