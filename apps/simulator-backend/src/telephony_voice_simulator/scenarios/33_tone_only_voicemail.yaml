# Some answering devices and damaged carrier paths expose only the record
# tone: the greeting was disabled, clipped, or lost before media connected.
# The agent must use acoustic evidence, wait through the tone, and leave one
# complete message instead of treating the line as a silent human.
name: tone_only_voicemail
machine:
  main:
    - wait: 2.0
    - tone: {freq: 1000, duration: 0.6, amplitude: 12000}
    - hold: 45
    - hangup: true
config_overrides:
  voicemail_detection: {beep_detection: true}
expect:
  webhook_received: true
  ended_reason: call.ending.voicemail-left-message
  detection_layer_prefix_any_of: [livekit-amd, beep]
  message_start_after: {mark: tone_end, min: 0.1, max: 3.0}
  max_overlap_between_marks: {start: tone_start, end: tone_end, max_s: 0.05}
  message_content:
    expected: "Hi, this is Emily from Apex Motors calling about your recent service enquiry. Please give us a call back whenever convenient. Thank you, and have a great day!"
    min_recall: 0.75
