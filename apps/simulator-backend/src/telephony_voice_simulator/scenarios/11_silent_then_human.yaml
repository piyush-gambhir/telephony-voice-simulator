# Slow human pickup: 3s of dead air, then "hello?". Regression for the
# no_speech_timeout -> "treat as human" rule and for the opener playing
# without waiting out the AMD window.
name: silent_then_human
machine:
  main:
    - wait: 3.0
    - play: human_hello_delayed.wav
    - hold: 30
expect:
  webhook_received: true
  detection_layer_absent: true
  ended_reason_not:
    - call.ending.voicemail-left-message
    - call.ending.voicemail-hangup
    - call.ending.machine-ivr
  agent_spoke: true
  first_agent_speech_after: {mark: audio_path_ready, min: 0.0, max: 5.0}
  agent_speech_after: {mark: "play_end:human_hello_delayed.wav", min: 0.0, max: 4.0}
