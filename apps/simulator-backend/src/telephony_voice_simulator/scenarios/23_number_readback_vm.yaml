# Carrier voicemail that reads the dialed number back digit-by-digit before
# the unavailable prompt. The spoken digits look like an IVR menu, but there
# is no menu: the agent must still recognize voicemail, leave the message, and
# never try to press a key.
name: number_readback_vm
machine:
  main:
    - wait: 0.8
    - play: number_readback_vm.wav
    - wait: 1.0
    - tone: {freq: 1000, duration: 0.5, amplitude: 12000}
    - hold: 45
config_overrides:
  voicemail_detection: {beep_detection: true, semantic_detection: true}
expect:
  webhook_received: true
  ended_reason: call.ending.voicemail-left-message
  detection_layer_prefix_any_of: [livekit-amd, phrase-fallback, semantic]
  message_start_after: {mark: tone_end, min: 0.1, max: 3.0}
  message_content:
    expected: "Hi, this is Emily from Apex Motors calling about your recent service enquiry. Please give us a call back whenever convenient. Thank you, and have a great day!"
    min_recall: 0.75
