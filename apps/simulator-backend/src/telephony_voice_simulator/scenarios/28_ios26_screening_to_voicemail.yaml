# iOS call screening path where the device collects the agent's identity, then
# rejects/forwards to voicemail. This is the state transition that plain AMD
# often misreads because both the screener and the mailbox look "machine-like".
name: ios26_screening_to_voicemail
machine:
  main:
    - wait: 0.8
    - play: ios26_name_reason_screen.wav
    - wait: 7.0
    - play: ios26_stay_on_line.wav
    - wait: 2.0
    - play: iphone_live_voicemail_default.wav
    - wait: 0.8
    - tone: {freq: 1000, duration: 0.6, amplitude: 12000}
    - hold: 45
    - hangup: true
config_overrides:
  voicemail_detection: {beep_detection: true, screener_detection: true}
expect:
  webhook_received: true
  ended_reason: call.ending.voicemail-left-message
  detection_layer_prefix_any_of: [livekit-amd, phrase-fallback]
  first_agent_speech_after:
    {mark: "play_end:ios26_name_reason_screen.wav", min: 0.0, max: 4.0}
  message_start_after: {mark: tone_end, min: 0.1, max: 3.0}
  max_overlap_with_playback: {asset: iphone_live_voicemail_default.wav, max_s: 0.5}
