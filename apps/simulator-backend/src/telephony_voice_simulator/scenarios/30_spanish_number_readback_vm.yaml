# Production regression: Spanish voicemail reads the destination number, then
# asks for a message. This was ending in silence_timeout with AMD=uncertain.
name: spanish_number_readback_vm
machine:
  main:
    - wait: 0.8
    - play: spanish_number_readback_vm.wav
    - wait: 0.8
    - tone: {freq: 1000, duration: 0.5, amplitude: 12000}
    - hold: 45
config_overrides:
  voicemail_detection: {beep_detection: true}
expect:
  webhook_received: true
  ended_reason: call.ending.voicemail-left-message
  detection_layer_prefix_any_of: [livekit-amd, phrase-fallback]
  message_start_after: {mark: tone_end, min: 0.1, max: 3.0}
  message_content:
    expected: "Hi, this is Emily from Apex Motors calling about your recent service enquiry. Please give us a call back whenever convenient. Thank you, and have a great day!"
    min_recall: 0.75
