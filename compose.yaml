name: telephony-voice-simulator

services:
  simulator-backend:
    build:
      context: apps/simulator-backend
    environment:
      SIMULATOR_BIND_HOST: 0.0.0.0
      SIMULATOR_BIND_PORT: 8978
      SIMULATOR_RUNTIME_DIR: /var/lib/telephony-voice-simulator
      SIMULATOR_DATABASE_URI: ${SIMULATOR_DATABASE_URI:-}
      SIMULATOR_DB_PATH: /var/lib/telephony-voice-simulator/simulator.db
      SIMULATOR_WEB_ORIGINS: ${SIMULATOR_WEB_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      PSTN_RECORD_ALL_CALLS: "false"
    ports:
      - "${SIMULATOR_LISTEN_ADDRESS:-127.0.0.1}:8978:8978"
    volumes:
      - simulator-data:/var/lib/telephony-voice-simulator
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8978/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web-console:
    build:
      context: .
      dockerfile: apps/web-console/Dockerfile
      args:
        NEXT_PUBLIC_SIMULATOR_API_URL: ${NEXT_PUBLIC_SIMULATOR_API_URL:-http://127.0.0.1:8978}
    ports:
      - "${WEB_LISTEN_ADDRESS:-127.0.0.1}:3000:8080"
    depends_on:
      simulator-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  simulator-data:
