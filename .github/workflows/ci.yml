name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: simulator_test
          MYSQL_USER: simulator_test
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-test-only --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      SIMULATOR_TEST_MYSQL_URI: mysql+pymysql://simulator_test:ci-test-only@127.0.0.1:3306/simulator_test
    defaults:
      run:
        working-directory: apps/simulator-backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: apps/simulator-backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run telephony-voice-sim scenarios validate --all
      - run: uv run python ../../scripts/check_python_licenses.py
      - run: uv run telephony-voice-sim uat check --config config/uat.example.yaml
      - run: uv run telephony-voice-sim corpus prompts --check
      - run: uv build
      - run: uv run python ../../scripts/check_public_release.py --archives-in dist

  web-console:
    strategy:
      matrix:
        node: ["24.22.1", "26.12.1"]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix deploy/twilio-ivr --ignore-scripts
      - run: python3 scripts/check_javascript_licenses.py --project all
      - run: npm --prefix deploy/twilio-ivr test
      - run: npm --prefix deploy/twilio-ivr run audit:ci
      - run: pnpm audit --prod --audit-level=critical
      - run: pnpm --filter web-console lint
      - run: pnpm --filter web-console typecheck
      - run: pnpm ui:check
      - run: pnpm --filter web-console build
      - run: python3 scripts/check_public_release.py

  deployment-config:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose files
        env:
          SIMULATOR_OPERATOR_TOKEN: ci-only-placeholder
          PUBLIC_BASE_URL: https://simulator.example.test
          TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
          TWILIO_AUTH_TOKEN: ci-only-placeholder
          SIMULATOR_PRIVATE_CORPUS_DIR: apps/simulator-backend/src/telephony_voice_simulator/corpus
          PSTN_ACKNOWLEDGE_PUBLIC_AUDIO: "true"
        run: docker compose -f compose.yaml -f compose.pstn.yaml config --quiet
      - name: Check Twilio Function syntax
        run: node --check deploy/twilio-ivr/functions/ivr.protected.js
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/simulator-backend
          push: false
      - name: Build web-console image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web-console/Dockerfile
          push: false

  required-web-console:
    name: web-console
    needs: web-console
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    steps:
      - name: Require both console runtimes
        env:
          RESULT: ${{ needs.web-console.result }}
        run: test "$RESULT" = success
