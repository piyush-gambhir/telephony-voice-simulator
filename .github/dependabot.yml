version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/"
      - "/apps/simulator-backend"
      - "/apps/web-console"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint (via eslint-config-next) needs the TS 6 JS API;
      # type checking already runs on the `typescript7` alias.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - "/apps/simulator-backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
